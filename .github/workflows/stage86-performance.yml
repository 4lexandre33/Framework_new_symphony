name: Stage 86 Performance & Resource Lifecycle

on:
  push:
    branches:
      - teste/cena-3d-tauri
    paths:
      - "ETAPA86_MANIFEST.json"
      - "ETAPA86_PERFORMANCE_RESOURCE_LIFECYCLE.txt"
      - "INSTALL_STAGE86.txt"
      - "LAYER1_PERFORMANCE_RESOURCE_BASELINE_V1.json"
      - "package.json"
      - "scripts/architecture/lib/layer1-performance-lifecycle-v1.mjs"
      - "scripts/architecture/stage86-audit-performance-lifecycle.mjs"
      - "scripts/architecture/stage86-validate-performance-lifecycle.mjs"
      - "scripts/architecture/stage86-finalize-performance-lifecycle.mjs"
      - "tests/layer1-performance-hotpaths.test.ts"
      - "tests/layer1-performance-resource-lifecycle.test.ts"
      - "tests/run-stage86-performance-smoke.mjs"
      - ".github/workflows/stage86-performance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage86-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Certify Layer 1 Stage 86
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout Stage 86 branch
        uses: actions/checkout@v4
        with:
          ref: teste/cena-3d-tauri
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 1.97 stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Linux Tauri dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Validate and finalize Stage 86
        run: node scripts/architecture/stage86-finalize-performance-lifecycle.mjs

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- src-tauri/Cargo.toml

      - name: Commit Stage 86 certification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ETAPA86_RUNTIME_EVIDENCE.json \
            ETAPA86_PERFORMANCE_RESOURCE_EVIDENCE.json \
            ETAPA86_AUTOMATED_PASS.json \
            ETAPA86_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No Stage 86 evidence changes to commit."
          else
            git commit -m "certify layer1 performance and resource lifecycle"
            git push origin HEAD:teste/cena-3d-tauri
          fi
